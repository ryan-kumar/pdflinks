         body {

        .view {

        .container {

            border-radius: 12px;
            overflow: hidden;
            background-color: #fffdf8;

            padding: 20px;
        }
        .pdfbox {
            width: 100%;
            height: 700px;

            border:none;
        }
        @media (max-width: 768px) {

            }

        .dbox {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bullet {
            display: block;
            font-size: 30px;
            text-align: center;
            margin: 6px 0;
            text-decoration: none;
            color: #4a3e30;
            transition: color 0.2s ease-in;
        }
        .bullet:hover {
            color: #8a6d46;
            text-decoration: underline;
        }
        .set {
            display: none;
            justify-content: center;
            gap: 5px;
            padding: 20px 0;
            width: 100%;
        }
        .set.on {
            display: flex;
        }
        .buttonContainer {
            position: relative;
        }
        .button {
            position: absolute;
            top: -450px;
            transform: none;
            background-color: #5a4634;
            color: #fffdf9;
            border: none;
            padding: 12px 43px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, transform 0.2s;
            z-index: 10;
        }
        #prev {
            left: -100px; /* adjust this as needed */
        }
        #next {
            right: -100px; /* adjust this as needed */
        }
        .button:hover {
            background-color: #8a6d46;
        }
        .button.disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: default;
        }
        .titlepage{
            height: 700px;
            display: flex;
            flex-direction: column;
            justify-content: center; 
        }
        .infopage{
            height: 700px;
            display: flex;
            flex-direction: column;
        }
        .tabon{
            display: flex;
            width: 200px;
            height: 50px;
            background-color:  #fffdf8;
            border: 1px solid #d8cfc4;
            border-radius: 12px;
            justify-content: center;
            position: relative;
            top: 10px; 
            left: 20px;
            z-index: 0; 
        }
        .taboff{
            width: 200px;
            height: 50px;
        }
        .tabcontenton{
            display: block;
            font-size: 20px;
            text-align: center;
            margin: 6px 0;
            text-decoration: none;
            color: #4a3e30;
            transition: color 0.2s ease-in;
        }
        .tabcontentoff{
            display: none;
        }
        .view{
            margin-top: 40px;
            background-color: #667662; 
            border: 3px solid #d1c2b1; 
            border-radius: 12px;
            width: 100%;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            box-shadow:
                inset 0 0 30px rgba(255, 255, 255, 0.1),
                5px 10px 20px rgba(0, 0, 0, 0.3);
            padding-top: 5px;
            padding-bottom: 5px;
            padding-left: 40px;
            padding-right: 40px;
            position: relative;
            transform: scale(0.9); 
            transform-origin: top center;

        }
        .hidden {
            display: none;
        }
      
    
    </style>
</head>

    <div class="buttonContainer">
        <button class="button" id="prev" onclick="prevSlide()">&#10094;</button>
        <button class="button" id="next" onclick="nextSlide()">&#10095;</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let current = 0;
            const slides = Array.from(document.querySelectorAll('.set')); 
            const chapters = {
                "Summer 2010" : 1,
                "Summer 2011" : 3,
                "Winter 2012" : 6
            };
            function forceReloadPDFs(slide) {
                const iframes = slide.querySelectorAll("iframe");

                iframes.forEach((iframe) => {
                    let loaded = false;

                    iframe.onload = () => {
                        loaded = true;
                    };

                    setTimeout(() => {
                        if (!loaded) {
                            const src = iframe.src;
                            iframe.src = '';
                            iframe.src = src;
                        }
                    }, 1000);
                });
            }

    
            window.displaySlide= function(index) {
                slides.forEach(slide => slide.classList.remove('on'));
                slides[index].classList.add('on');
                current = index;
                dullButtons();
                displayTabs();
                forceReloadPDFs(slides[index]); // Reload PDFs
            }
            function displayTabs() {
                const toc = document.getElementById('tabletab');
                const content = document.getElementById('toc');
                if (current > 0) {
                    toc.classList.remove('taboff');
                    toc.classList.add('tabon');
                    content.classList.remove('tabcontentoff');
                    content.classList.add('tabcontenton');

                } else {
                    toc.classList.remove('tabon');
                    toc.classList.add('taboff');
                    content.classList.remove('tabcontenton');
                    content.classList.add('tabcontentoff');
                }
            }
    
            function dullButtons() {
                const prev = document.getElementById('prev');
                const next = document.getElementById('next');
                
                prev.classList.remove('disabled');
                next.classList.remove('disabled');
    
                if (current == 0) prev.classList.add('disabled');
                if (current == slides.length - 1) next.classList.add('disabled');
            }
    
            window.pageNav = function(newsletter) {
                displaySlide(chapters[newsletter]);
            };
    
            window.nextSlide = function () {
                if (current < slides.length - 1) {
                    displaySlide(current + 1);
                }
            };
    
            window.prevSlide = function () {
                if (current > 0) {
                    displaySlide(current - 1);
                }
            };
    
            displaySlide(current);
        });
    
        document.addEventListener("keydown", function (event) {
            if (event.key === "ArrowLeft") {
                prevSlide();
            } else if (event.key === "ArrowRight") {
                nextSlide();
            }
        });
    </script>
